<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Summum</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <div class="app-container">
      <div class="header-stats">
        <div>
        <div class="stat-label">Summum <span id="app-version" class="version-text"></span></div>
          <div class="stat-group">
            <div>
              <span class="label">Acc:</span> <span id="ui-acc">0</span>%
            </div>
            <div>
              <span class="label">Strk:</span> <span id="ui-streak">0</span>
            </div>
          </div>
        </div>
        <div class="stat-right">
          <div>
            <span class="label">Pace:</span> <span id="ui-pace">3.00</span>s
          </div>
          <div>
            <span class="label">Best:</span> <span id="ui-best">3.00</span>s
          </div>
        </div>
      </div>

      <div class="progress-container">
        <div id="progress-bar" class="progress-bar" style="width: 100%"></div>
      </div>

      <div id="display-area" class="display-area border-normal">
        <div id="idle-text" class="idle-text">
          <p>Sum current digit with the previous.</p>
          <p class="sub">2 correct = faster. 1 miss = slower. 20 rounds.</p>
        </div>
        <div id="digit" class="digit-text hidden">?</div>
      </div>

      <div id="numpad" class="numpad">
        </div>

      <div id="status-text" class="status-text"></div>
    </div>

    <div id="results-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <h2>Session Complete</h2>
        <div class="modal-stats">
          <div class="modal-stat">
            <span class="label">Correct:</span>
            <span><span id="modal-correct">0</span> / <span id="modal-total">0</span></span>
          </div>
          <div class="modal-stat">
            <span class="label">Accuracy:</span>
            <span><span id="modal-acc">0</span>%</span>
          </div>
          <div class="modal-stat">
            <span class="label">Best Pace:</span>
            <span><span id="modal-best">0</span>s</span>
          </div>
        </div>
        <button id="modal-close-btn" class="modal-btn">Close</button>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
