<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palace Loci Editor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 10px 16px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: #888;
        }

        .header-buttons { display: flex; gap: 8px; align-items: center; }

        button.action, label.action {
            background: #2a2a2a;
            color: #aaa;
            border: 1px solid #383838;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button.action:hover, label.action:hover { background: #333; }
        button.action:disabled { opacity: 0.3; cursor: default; }

        .main {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 200px;
            border-right: 1px solid #242424;
            overflow-y: auto;
            flex-shrink: 0;
            transition: width 0.2s ease, opacity 0.2s ease;
        }
        .sidebar.collapsed {
            width: 0;
            opacity: 0;
            overflow: hidden;
            border-right: none;
        }

        .palace-item {
            padding: 7px 12px;
            cursor: pointer;
            display: flex;
            gap: 8px;
            align-items: baseline;
            border-bottom: 1px solid #202020;
            user-select: none;
        }
        .palace-item:hover { background: #202020; }
        .palace-item.active { background: #252525; border-left: 2px solid #555; padding-left: 10px; }

        .p-letter {
            font-weight: 700;
            font-size: 15px;
            min-width: 14px;
            color: #444;
        }
        .palace-item.in-progress .p-letter { color: #7aaec0; }
        .palace-item.finished .p-letter    { color: #7abf8a; }
        .palace-item.exported .p-letter    { color: #555; }
        .palace-item.active .p-letter      { color: #ccc; }

        .p-name {
            font-size: 13px;
            color: #444;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .palace-item.in-progress .p-name { color: #555; }
        .palace-item.finished .p-name    { color: #555; }
        .palace-item.exported .p-name    { color: #3a3a3a; }
        .palace-item.active .p-name      { color: #888; }

        .p-count {
            font-size: 11px;
            color: #555;
            margin-left: auto;
            flex-shrink: 0;
        }
        .palace-item.active .p-count { color: #888; }

        .p-badge {
            font-size: 11px;
            margin-left: 6px;
            padding: 1px 5px;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .palace-item.finished .p-badge  { background: #2a4a35; color: #7abf8a; content: 'done'; }
        .palace-item.exported .p-badge  { background: #2a2a2a; color: #555; }

        /* ── Editor ── */
        .editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            min-width: 0;
        }

        .context-bar {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            border-bottom: 1px solid #242424;
            flex-shrink: 0;
            align-items: center;
        }

        .context-bar input, .context-bar select {
            background: #222;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
        }
        .context-bar input { width: 160px; }
        .context-bar select { width: 100px; cursor: pointer; }
        .context-bar input:focus, .context-bar select:focus { border-color: #555; }
        .context-bar input::placeholder { color: #444; }
        .context-label { font-size: 13px; color: #555; }

        .status-bar {
            display: flex;
            gap: 8px;
            padding: 8px 16px;
            border-bottom: 1px solid #242424;
            flex-shrink: 0;
            align-items: center;
        }
        .status-bar .spacer { flex: 1; }
        button.status-btn {
            font-size: 14px;
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid #383838;
            cursor: pointer;
            background: #222;
            color: #666;
        }
        button.status-btn.on-finished { background: #1e3528; color: #7abf8a; border-color: #2e5040; }
        button.status-btn.on-exported { background: #252525; color: #666; border-color: #444; }
        button.status-btn:hover { filter: brightness(1.2); }

        .loci-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px;
        }

        .room-group { margin-bottom: 12px; }

        .room-header {
            font-size: 12px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 4px 0 2px;
            border-bottom: 1px solid #242424;
            margin-bottom: 4px;
        }

        .locus-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 0;
        }
        .locus-n {
            font-size: 12px;
            color: #3a3a3a;
            min-width: 20px;
            text-align: right;
            flex-shrink: 0;
        }
        .locus-text {
            flex: 1;
            font-size: 15px;
        }
        .locus-del {
            background: none;
            border: none;
            color: #333;
            cursor: pointer;
            font-size: 14px;
            padding: 1px 5px;
            flex-shrink: 0;
        }
        .locus-del:hover { color: #c44; }

        .entry-bar {
            padding: 10px 16px;
            border-top: 1px solid #242424;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            align-items: center;
        }

        .entry-bar input {
            flex: 1;
            background: #202020;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
        }
        .entry-bar input:focus { border-color: #666; }

        .context-display {
            font-size: 12px;
            color: #444;
            white-space: nowrap;
        }

        .no-selection {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 15px;
        }

        .placeholder-msg {
            color: #383838;
            font-size: 14px;
            padding: 8px 0;
        }
    </style>
</head>
<body>

<header>
    <div style="display:flex;align-items:center;gap:10px">
        <button class="action" id="btn-sidebar-toggle" onclick="toggleSidebar()" style="font-size:1rem;padding:4px 10px">☰</button>
        <h1>PALACE LOCI</h1>
        <a href="index.html" style="font-size:14px;color:#444;text-decoration:none" title="Back to Palace">π</a>
    </div>
    <div class="header-buttons">
        <button class="action" id="btn-export" onclick="exportCSV()" disabled>Export</button>
        <button class="action" id="btn-export-md" onclick="exportMarkdown()" disabled>MD</button>
        <button class="action" id="btn-clear" onclick="clearCurrent()" disabled>Clear</button>
        <label class="action">
            Load
            <input type="file" id="file-input" accept=".txt,.csv" style="display:none" onchange="loadFile(event)">
        </label>
    </div>
</header>

<div class="main">
    <div class="sidebar" id="sidebar">
        <div style="padding:12px;font-size:0.75rem;color:#333">Load a file first</div>
    </div>
    <div class="editor" id="editor">
        <div class="no-selection">Load a palace list to begin.</div>
    </div>
</div>

<script>
let PALACES = [];
let activeLetter = null;

function loadData(letter) {
    try { return JSON.parse(localStorage.getItem('loci2_' + letter) || '[]'); }
    catch { return []; }
}
function saveData(letter, data) {
    localStorage.setItem('loci2_' + letter, JSON.stringify(data));
}

function getStatus(letter) {
    return localStorage.getItem('status_' + letter) || '';
}
function setStatus(letter, status) {
    localStorage.setItem('status_' + letter, status);
}

// ── File loading ──

function parsePalaces(text) {
    const palaces = [];
    for (const line of text.split('\n')) {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('#')) continue;
        const parts = trimmed.split('\t');
        if (parts.length < 2) continue;
        const letter = parts[0].trim();
        const name = parts[1].replace(/\s*—\s*$/, '').trim();
        if (letter.length === 1 && /[A-Z]/i.test(letter) && name) {
            palaces.push({ letter: letter.toUpperCase(), name });
        }
    }
    return palaces;
}

function applyPalaces(palaces) {
    if (palaces.length === 0) { alert('No palaces found — check file format.'); return; }
    PALACES = palaces;
    document.getElementById('btn-export').disabled = false;
    document.getElementById('btn-export-md').disabled = false;
    activeLetter = null;
    renderSidebar();
    document.getElementById('editor').innerHTML = '<div class="no-selection">Select a palace →</div>';
}

function loadFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        const palaces = parsePalaces(ev.target.result);
        if (palaces.length === 0) { alert('No palaces found — check file format.'); return; }
        localStorage.setItem('palace_file', ev.target.result);
        applyPalaces(palaces);
    };
    reader.readAsText(file);
}

const savedFile = localStorage.getItem('palace_file');
if (savedFile) applyPalaces(parsePalaces(savedFile));

// ── Sidebar ──

function palaceClass(letter) {
    const status = getStatus(letter);
    if (status === 'exported') return 'exported';
    if (status === 'finished') return 'finished';
    if (loadData(letter).length > 0) return 'in-progress';
    return '';
}

function renderSidebar() {
    document.getElementById('sidebar').innerHTML = PALACES.map(p => {
        const cls = palaceClass(p.letter);
        const isActive = p.letter === activeLetter;
        const badge = cls === 'finished' ? '<span class="p-badge">done</span>'
                    : cls === 'exported' ? '<span class="p-badge">exported</span>'
                    : '';
        const count = loadData(p.letter).length;
        const countBadge = count > 0 ? `<span class="p-count">${count}</span>` : '';
        return `<div class="palace-item ${cls}${isActive ? ' active' : ''}"
                     onclick="selectPalace('${p.letter}')">
            <span class="p-letter">${p.letter}</span>
            <span class="p-name">${p.name}</span>
            ${countBadge}${badge}
        </div>`;
    }).join('');
}

// ── Sidebar toggle ──

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('collapsed');
}

function collapseSidebarOnMobile() {
    if (window.innerWidth < 600) {
        document.getElementById('sidebar').classList.add('collapsed');
    }
}

// ── Select palace ──

function selectPalace(letter) {
    activeLetter = letter;
    document.getElementById('btn-clear').disabled = false;
    collapseSidebarOnMobile();
    renderSidebar();
    renderEditor();
}

// ── Editor ──

let currentRoom = '';
let currentPosition = '';

function renderEditor() {
    const p = PALACES.find(x => x.letter === activeLetter);
    const data = loadData(activeLetter);
    const status = getStatus(activeLetter);

    const groups = [];
    let lastKey = null;
    data.forEach((entry, i) => {
        const key = entry.room + (entry.position ? ' / ' + entry.position : '');
        if (key !== lastKey) { groups.push({ label: key, items: [] }); lastKey = key; }
        groups[groups.length - 1].items.push({ ...entry, idx: i });
    });

    document.getElementById('editor').innerHTML = `
        <div class="context-bar">
            <span class="context-label">Room</span>
            <input id="inp-room" type="text" placeholder="e.g. Living room" value="${currentRoom}">
            <select id="inp-pos">
                <option value=""         ${currentPosition===''?'selected':''}>—</option>
                <option value="Left"     ${currentPosition==='Left'?'selected':''}>Left</option>
                <option value="Right"    ${currentPosition==='Right'?'selected':''}>Right</option>
                <option value="Straight" ${currentPosition==='Straight'?'selected':''}>Straight</option>
            </select>
        </div>
        <div class="status-bar">
            <span style="font-size:0.78rem;color:#444">${p.name} · ${data.length} loci</span>
            <span class="spacer"></span>
            <button class="status-btn ${status==='finished'||status==='exported' ? 'on-finished' : ''}"
                    onclick="toggleFinished()">
                ${status==='finished'||status==='exported' ? '✓ Finished' : 'Mark finished'}
            </button>
            <button class="status-btn ${status==='exported' ? 'on-exported' : ''}"
                    onclick="toggleExported()">
                ${status==='exported' ? '✓ Exported' : 'Mark exported'}
            </button>
        </div>
        <div class="loci-list" id="loci-list">
            ${data.length === 0
                ? '<div class="placeholder-msg">No loci yet.</div>'
                : groups.map(g => `
                    <div class="room-group">
                        <div class="room-header">${g.label}</div>
                        ${g.items.map(it => `
                            <div class="locus-item">
                                <span class="locus-n">${it.idx + 1}</span>
                                <span class="locus-text">${it.item}</span>
                                <button class="locus-del" onclick="deleteLocus(${it.idx})">✕</button>
                            </div>`).join('')}
                    </div>`).join('')}
        </div>
        <div class="entry-bar">
            <span class="context-display" id="ctx-display">${contextLabel()}</span>
            <input id="locus-input" type="text" placeholder="Item…" onkeydown="handleEntry(event)" autofocus>
        </div>
    `;

    document.getElementById('inp-room').addEventListener('input', function() {
        currentRoom = this.value.trim();
        document.getElementById('ctx-display').textContent = contextLabel();
    });
    document.getElementById('inp-pos').addEventListener('change', function() {
        currentPosition = this.value;
        document.getElementById('ctx-display').textContent = contextLabel();
    });

    const list = document.getElementById('loci-list');
    if (list) list.scrollTop = list.scrollHeight;
    document.getElementById('locus-input').focus();
}

function contextLabel() {
    if (!currentRoom && !currentPosition) return 'no context set';
    return [currentRoom, currentPosition].filter(Boolean).join(' / ');
}

function handleEntry(e) {
    if (e.key !== 'Enter') return;
    const input = document.getElementById('locus-input');
    const val = input.value.trim();
    if (!val) return;
    if (!currentRoom) {
        const r = document.getElementById('inp-room');
        r.focus(); r.style.borderColor = '#c44';
        setTimeout(() => r.style.borderColor = '', 800);
        return;
    }
    const data = loadData(activeLetter);
    data.push({ room: currentRoom, position: currentPosition, item: val });
    saveData(activeLetter, data);
    renderSidebar();
    renderEditor();
}

function deleteLocus(i) {
    const data = loadData(activeLetter);
    data.splice(i, 1);
    saveData(activeLetter, data);
    renderSidebar();
    renderEditor();
}

function toggleFinished() {
    const s = getStatus(activeLetter);
    setStatus(activeLetter, s === 'finished' ? '' : 'finished');
    renderSidebar();
    renderEditor();
}

function toggleExported() {
    const s = getStatus(activeLetter);
    setStatus(activeLetter, s === 'exported' ? 'finished' : 'exported');
    renderSidebar();
    renderEditor();
}

// ── Export: only finished + not yet exported ──

function generateCards(letter, data) {
    const cards = [];
    const esc = s => '"' + (s||'').replace(/"/g, '""') + '"';
    for (let i = 0; i < data.length - 1; i++) {
        const curr = data[i];
        const next = data[i + 1];
        const front = `${letter}: After ${curr.room} — ${curr.item}?`;
        const roomChange = curr.room !== next.room;
        const pos = next.position ? `${next.position}, ` : '';
        const back = roomChange ? `${next.room} — ${pos}${next.item}` : (next.position ? `${next.position}, ${next.item}` : next.item);
        cards.push(`${esc(front)},${esc(back)}`);
    }
    if (data.length > 0) {
        const last = data[data.length - 1];
        const front = `${letter}: After ${last.room} — ${last.item}?`;
        cards.push(`${esc(front)},${esc(`End of ${letter}`)}`);
    }
    return cards;
}

function exportCSV() {
    let toExport = PALACES.filter(p => getStatus(p.letter) === 'finished');
    if (toExport.length === 0) {
        const nonEmpty = PALACES.filter(p => loadData(p.letter).length > 0);
        const allExported = nonEmpty.length > 0 && nonEmpty.every(p => getStatus(p.letter) === 'exported');
        if (allExported) {
            toExport = nonEmpty;
        } else {
            alert('No finished (non-exported) palaces to export.');
            return;
        }
    }
    const rows = [];
    for (const p of toExport) {
        rows.push(...generateCards(p.letter, loadData(p.letter)));
    }
    const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'palace-loci.csv';
    a.click();
    for (const p of toExport) setStatus(p.letter, 'exported');
    renderSidebar();
    if (activeLetter && toExport.find(p => p.letter === activeLetter)) renderEditor();
}

// ── Markdown export ──

function exportMarkdown() {
    const lines = [];
    for (const p of PALACES) {
        const data = loadData(p.letter);
        if (data.length === 0) continue;
        lines.push(`## ${p.letter} — ${p.name}`);
        lines.push('');
        let currentRoom = null;
        for (const locus of data) {
            if (locus.room !== currentRoom) {
                currentRoom = locus.room;
                lines.push(`- **${currentRoom}**`);
            }
            const pos = locus.position ? `${locus.position}: ` : '';
            lines.push(`  - ${pos}${locus.item}`);
        }
        lines.push('');
    }
    if (lines.length === 0) { alert('No loci entered yet.'); return; }
    const blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'palace-loci.md';
    a.click();
}

// ── Clear ──

function clearCurrent() {
    if (!activeLetter) return;
    if (!confirm(`Clear all loci for ${activeLetter}?`)) return;
    saveData(activeLetter, []);
    setStatus(activeLetter, '');
    renderSidebar();
    renderEditor();
}
</script>
</body>
</html>
