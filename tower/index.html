<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axiom Grid // Synthwave TD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.6.6/pixi.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="w-screen h-screen relative bg-[#080612] text-slate-100 overflow-hidden">

  <div id="game-container" class="w-full h-full absolute inset-0 cursor-crosshair"></div>
  <div class="scanlines absolute inset-0 z-10 pointer-events-none"></div>

  <!-- Top Status Bar -->
  <header class="absolute top-4 left-4 right-4 z-20 flex flex-wrap justify-between items-center gap-3 pointer-events-none">

    <!-- Telemetry Badges -->
    <div class="glass-panel neon-border-cyan px-5 py-2.5 rounded-lg flex items-center gap-6 pointer-events-auto shadow-2xl">
      <!-- Energy / Flux -->
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded bg-cyan-500/10 border border-cyan-400/40 flex items-center justify-center text-cyan-300">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M11.3 1.05a1 1 0 00-1.6 0l-7 10A1 1 0 003.5 13H9l-1.3 5.95a1 1 0 001.6 1.05l7-10a1 1 0 00-.8-1.5H11l1.3-4.45z"/></svg>
        </div>
        <div>
          <div class="text-[10px] text-cyan-400/70 tracking-wider font-semibold">FLUX RESERVE</div>
          <div id="ui-flux" class="text-lg font-bold text-cyan-300 mono leading-none">280</div>
        </div>
      </div>

      <!-- Core Integrity (Sanity) -->
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded bg-rose-500/10 border border-rose-400/40 flex items-center justify-center text-rose-400">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"/></svg>
        </div>
        <div>
          <div class="text-[10px] text-rose-400/70 tracking-wider font-semibold">SANITY CORE</div>
          <div id="ui-sanity" class="text-lg font-bold text-rose-400 mono leading-none">20 / 20</div>
        </div>
      </div>

      <!-- Wave Counter -->
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded bg-purple-500/10 border border-purple-400/40 flex items-center justify-center text-purple-300">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zm1 11H9v-2h2v2zm0-4H9V5h2v4z"/></svg>
        </div>
        <div>
          <div class="text-[10px] text-purple-400/70 tracking-wider font-semibold">WAVE VECTOR</div>
          <div id="ui-wave" class="text-lg font-bold text-purple-300 mono leading-none">1 / 15</div>
        </div>
      </div>

      <!-- Power -->
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded bg-yellow-500/10 border border-yellow-400/40 flex items-center justify-center text-yellow-300">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M11.3 1.05a1 1 0 00-1.6 0l-7 10A1 1 0 003.5 13H9l-1.3 5.95a1 1 0 001.6 1.05l7-10a1 1 0 00-.8-1.5H11l1.3-4.45z"/></svg>
        </div>
        <div>
          <div class="text-[10px] text-yellow-400/70 tracking-wider font-semibold">GRID POWER</div>
          <div id="ui-power" class="text-lg font-bold text-yellow-300 mono leading-none">0 / 1</div>
        </div>
      </div>
    </div>
  </header>

  <footer class="absolute bottom-4 left-4 right-4 z-20 flex flex-col md:flex-row justify-between items-end gap-3 pointer-events-none">

    <!-- Build Towers Palette -->
    <div class="glass-panel neon-border-cyan p-3 rounded-xl pointer-events-auto flex items-center gap-2.5 shadow-2xl">
      <div class="text-[11px] font-semibold tracking-wider text-cyan-400 hidden sm:block px-1">
        DEPLOY TOWERS
      </div>

      <!-- Obelisk -->
      <button id="btn-tower-obelisk" class="hud-btn flex flex-col items-center justify-center p-2.5 rounded-lg border border-cyan-500/40 bg-slate-900/60 hover:bg-cyan-950/40 w-24">
        <div class="w-8 h-8 flex items-center justify-center mb-1">
          <svg viewBox="0 0 32 32" class="w-7 h-7 text-cyan-300 fill-current">
            <polygon points="16,2 22,22 16,30 10,22" fill-opacity="0.8"/>
            <polygon points="16,2 20,22 16,27" fill="#ffffff" fill-opacity="0.5"/>
          </svg>
        </div>
        <span class="text-xs font-bold text-cyan-200">FAST</span>
        <span class="text-[11px] text-cyan-400 mono font-semibold">100 ⚡</span>
      </button>

      <!-- Bastion -->
      <button id="btn-tower-bastion" class="hud-btn flex flex-col items-center justify-center p-2.5 rounded-lg border border-amber-500/40 bg-slate-900/60 hover:bg-amber-950/40 w-24">
        <div class="w-8 h-8 flex items-center justify-center mb-1">
          <svg viewBox="0 0 32 32" class="w-7 h-7 text-amber-300 fill-current">
            <rect x="6" y="20" width="20" height="8" rx="1" fill-opacity="0.8"/>
            <rect x="10" y="12" width="12" height="7" rx="1" fill-opacity="0.9"/>
            <circle cx="16" cy="7" r="4" fill="#ffffff" fill-opacity="0.9"/>
          </svg>
        </div>
        <span class="text-xs font-bold text-amber-200">MORTAR</span>
        <span class="text-[11px] text-amber-400 mono font-semibold">160 ⚡</span>
      </button>

      <!-- Prism -->
      <button id="btn-tower-prism" class="hud-btn flex flex-col items-center justify-center p-2.5 rounded-lg border border-teal-400/40 bg-slate-900/60 hover:bg-teal-950/40 w-24">
        <div class="w-8 h-8 flex items-center justify-center mb-1">
          <svg viewBox="0 0 32 32" class="w-7 h-7 text-teal-300 fill-current">
            <polygon points="16,4 28,26 4,26" fill-opacity="0.6"/>
            <polygon points="16,4 28,26 16,20" fill="#ffffff" fill-opacity="0.3"/>
            <circle cx="16" cy="17" r="3" fill="#2dd4bf"/>
          </svg>
        </div>
        <span class="text-xs font-bold text-teal-200">RAY</span>
        <span class="text-[11px] text-teal-300 mono font-semibold">140 ⚡</span>
      </button>

      <!-- Power Pylon -->
      <button id="btn-tower-pylon" class="hud-btn flex flex-col items-center justify-center p-2.5 rounded-lg border border-yellow-500/40 bg-slate-900/60 hover:bg-yellow-900/30 w-24">
        <div class="w-8 h-8 flex items-center justify-center mb-1">
          <svg viewBox="0 0 32 32" class="w-7 h-7 text-yellow-300">
            <circle cx="16" cy="10" r="5" fill="none" stroke="#fde68a" stroke-width="2"/>
            <circle cx="16" cy="10" r="2" fill="#fef9c3"/>
            <line x1="16" y1="15" x2="16" y2="28" stroke="#fbbf24" stroke-width="2"/>
            <line x1="10" y1="22" x2="22" y2="22" stroke="#fbbf24" stroke-width="1.5"/>
            <line x1="12" y1="28" x2="20" y2="28" stroke="#fbbf24" stroke-width="1.5"/>
          </svg>
        </div>
        <span class="text-xs font-bold text-yellow-200">CORE</span>
        <span class="text-[11px] text-yellow-400 mono font-semibold">120 ⚡</span>
        <span class="text-[10px] text-yellow-600 mono">+2 PWR</span>
      </button>

      <!-- Sanctuary Buffer -->
      <button id="btn-tower-sanctuary" class="hud-btn flex flex-col items-center justify-center p-2.5 rounded-lg border border-violet-400/40 bg-slate-900/60 hover:bg-violet-950/40 w-24">
        <div class="w-8 h-8 flex items-center justify-center mb-1">
          <svg viewBox="0 0 32 32" class="w-7 h-7 text-violet-300">
            <circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 2"/>
            <circle cx="16" cy="16" r="7" fill="none" stroke="#e0e7ff" stroke-width="2"/>
            <circle cx="16" cy="16" r="3" fill="#c084fc"/>
          </svg>
        </div>
        <span class="text-xs font-bold text-violet-200">HUB</span>
        <span class="text-[11px] text-violet-300 mono font-semibold">200 ⚡</span>
      </button>
    </div>

    <!-- Wave Controls & Diagnostics -->
    <div class="glass-panel neon-border-magenta p-3 rounded-xl pointer-events-auto flex items-center gap-3 shadow-2xl">
      <button id="btn-speed" class="hud-btn px-3 py-2.5 rounded-lg border border-pink-500/40 bg-pink-950/20 text-pink-300 hover:bg-pink-900/40 font-bold text-xs mono">
        1.0x
      </button>

      <button id="btn-autowave" class="hud-btn px-3 py-2.5 rounded-lg border border-slate-700 bg-slate-900/40 text-slate-400 hover:border-slate-500 font-semibold text-xs tracking-wider">
        AUTO: OFF
      </button>

      <button id="btn-launch-wave" class="hud-btn px-5 py-2.5 rounded-lg bg-gradient-to-r from-fuchsia-600 to-rose-600 text-white font-bold text-xs tracking-widest hover:brightness-125 shadow-lg shadow-fuchsia-600/30 flex items-center gap-2">
        <span>NEXT INCURSION</span>
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </button>
    </div>
  </footer>

  <!-- Tower Info Tooltip -->
  <div id="tower-tooltip" class="fixed z-40 pointer-events-none hidden">
    <div class="glass-panel neon-border-cyan px-3 py-2.5 rounded-lg shadow-2xl" style="min-width:148px">
      <div id="tt-name" class="text-[11px] font-bold text-cyan-300 tracking-widest mb-2"></div>
      <div class="flex flex-col gap-1 text-[11px] mono">
        <div class="flex justify-between gap-4">
          <span id="tt-dps-label" class="text-slate-500">DPS</span>
          <span id="tt-dps" class="text-slate-200"></span>
        </div>
        <div class="flex justify-between gap-4">
          <span class="text-slate-500">POWER</span>
          <span id="tt-power" class="text-yellow-300"></span>
        </div>
        <div class="flex justify-between gap-4">
          <span class="text-slate-500">RANGE</span>
          <span id="tt-range" class="text-slate-200"></span>
        </div>
        <div id="tt-cost-row" class="flex justify-between gap-4 border-t border-slate-700/50 mt-1 pt-1 hidden">
          <span class="text-slate-500">COST</span>
          <span id="tt-cost" class="text-cyan-300 font-bold"></span>
        </div>
        <div id="tt-status-row" class="flex justify-between gap-4 border-t border-slate-700/50 mt-1 pt-1">
          <span class="text-slate-500">STATUS</span>
          <span id="tt-status" class="font-bold"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-message" class="absolute top-20 left-1/2 -translate-x-1/2 z-30 pointer-events-none transition-all duration-300 opacity-0 transform -translate-y-2">
    <div class="glass-panel px-6 py-2 rounded-full border border-pink-500/50 text-pink-300 text-xs font-bold tracking-widest shadow-2xl flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-pink-500 animate-ping"></span>
      <span id="toast-text">SYNCHRONIZING ORBITAL GRID...</span>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
