<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skyscrapers Puzzle</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="lib/idb-keyval.js"></script>
    <script src="lib/jszip.min.js"></script>
    <script src="js/shared/epub-generator.js"></script>
    <script src="js/shared/app-manager.js"></script>
    <script src="js/skyscrapers.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Skyscrapers</h1>

      <canvas id="canvas"></canvas>

      <div class="tabs">
        <button class="tab-btn active" data-target="play-panel">Play</button>
        <button class="tab-btn" data-target="book-panel">Book</button>
      </div>

      <!-- Play Panel -->
      <div id="play-panel" class="tab-content active controls-panel">
        <div class="form-row">
          <button class="btn" onclick="app.play()">New Game</button>
          <button class="btn btn-secondary" onclick="app.toggleSolution()">
            Solution
          </button>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Grid Size</label>
            <input type="number" id="p_g" value="5" min="3" max="9" />
          </div>
        </div>
        <div class="note">Tap maze to toggle solution</div>
      </div>

      <!-- Book Panel -->
      <div id="book-panel" class="tab-content controls-panel">
        <div class="form-group">
          <label>Book Title</label>
          <input type="text" id="b_title" value="Skyscrapers Vol. 1" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Width</label>
            <input type="number" id="b_w" value="600" />
          </div>
          <div class="form-group">
            <label>Height</label>
            <input type="number" id="b_h" value="780" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Grid Size</label>
            <input type="number" id="b_g" value="5" />
          </div>
          <div class="form-group">
            <label>Count</label>
            <input type="number" id="b_n" value="20" />
          </div>
        </div>
        <div class="form-row">
          <button class="btn" id="btn-gen" onclick="app.generate('epub')">
            Download EPUB
          </button>
          <button
            class="btn btn-secondary"
            id="btn-zip"
            onclick="app.generate('zip')"
          >
            Download ZIP
          </button>
        </div>
        <div id="status" class="status"></div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const app = {
        manager: null,
        game: null,
        showingSolution: false,

        init: function () {
          this.manager = new AppManager({
            appName: "Skyscrapers",
            onResize: () => this.draw(),
          });

          // Set default canvas size
          canvas.width = 480;
          canvas.height = 780;

          this.play();

          canvas.addEventListener("click", (e) => {
            if (this.manager.mode === "play" && this.game) {
              e.preventDefault();
              this.toggleSolution();
            }
          });
        },

        play: function () {
          const g = parseInt(document.getElementById("p_g").value) || 5;
          this.game = new SkyscraperGrid(g);
          this.showingSolution = false;
          this.draw();
        },

        toggleSolution: function () {
          this.showingSolution = !this.showingSolution;
          this.draw();
        },

        draw: function () {
          if (this.game) {
            this.game.draw(
              ctx,
              canvas.width,
              canvas.height,
              this.showingSolution,
              false,
            );
          }
        },

        generate: async function (type) {
          const btnGen = document.getElementById("btn-gen");
          const btnZip = document.getElementById("btn-zip");
          const status = document.getElementById("status");
          const title = document.getElementById("b_title").value;
          const w = parseInt(document.getElementById("b_w").value);
          const h = parseInt(document.getElementById("b_h").value);
          const g = parseInt(document.getElementById("b_g").value);
          const n = parseInt(document.getElementById("b_n").value);

          btnGen.disabled = true;
          btnZip.disabled = true;
          const gen = new EpubGenerator();

          canvas.width = w;
          canvas.height = h;

          try {
            for (let i = 1; i <= n; i++) {
              status.innerText = `Generating ${i}/${n}...`;
              await new Promise((r) => setTimeout(r, 0));

              let puzzle = new SkyscraperGrid(g);

              // Puzzle
              puzzle.draw(ctx, w, h, false, true);
              const pData = canvas.toDataURL("image/png").split(",")[1];

              // Solution
              puzzle.draw(ctx, w, h, true, true);
              const sData = canvas.toDataURL("image/png").split(",")[1];

              gen.addPuzzlePair(pData, sData, i, "Tower");
            }

            status.innerText = "Packaging...";
            await new Promise((r) => setTimeout(r, 100));

            if (type === "epub") {
              gen.generate(title, "skyscrapers.epub");
            } else {
              gen.generateZip("skyscrapers.zip");
            }

            status.innerText = "Done!";
          } catch (e) {
            console.error(e);
            status.innerText = "Error";
          } finally {
            btnGen.disabled = false;
            btnZip.disabled = false;
            // Restore default dimensions
            canvas.width = 480;
            canvas.height = 780;
            if (this.game) this.draw();
          }
        },
      };

      window.onload = () => app.init();
    </script>
  </body>
</html>
