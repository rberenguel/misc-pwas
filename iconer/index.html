<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iconer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Corrected integrity attribute -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
      xintegrity="sha512-BNaRQnYJYiPSqHHDb58B0yaPfCu+Wgds8Gp/gU33kqBtgNS4tSPHuGibyoVBL5gI9kLmbG4dGxcIIJwIEDFSgg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <link rel="stylesheet" href="fonts/inter.css" />
    <link rel="stylesheet" href="fonts/monoid.css" />
    <link rel="stylesheet" href="fonts/reforma.css" />
    <link rel="stylesheet" href="fonts/roboto.css" />
    <link rel="stylesheet" href="fonts/iconoir/iconoir-font.css" />
    <link rel="stylesheet" href="fonts/phosphor/phosphor.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link id="google-font-link" href="" rel="stylesheet" />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      #custom-css-style {
      }
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .autocomplete-item {
        padding: 0.5rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        transition: background-color 0.15s;
      }
      .autocomplete-item:hover,
      .autocomplete-item.selected {
        background-color: #4b5563;
      }
      .autocomplete-icon {
        font-size: 1.25rem;
        width: 1.5rem;
        text-align: center;
        flex-shrink: 0;
      }
      .autocomplete-name {
        font-size: 0.875rem;
        color: #e5e7eb;
      }
      .autocomplete-source {
        font-size: 0.75rem;
        color: #9ca3af;
        margin-left: auto;
      }
      .iconoir-icon {
        font-family: "iconoir";
      }
      .phosphor-icon {
        font-family: "Phosphor-Light";
      }
    </style>
  </head>
  <body
    class="bg-gray-900 text-gray-100 flex flex-col items-center justify-center min-h-screen p-4"
  >
    <div
      class="w-full max-w-4xl bg-gray-800 rounded-2xl shadow-lg p-6 md:p-8 flex flex-col lg:flex-row gap-8"
    >
      <!-- CONTROLS PANEL -->
      <div class="lg:w-1/2 w-full space-y-6">
        <h1 class="text-2xl md:text-3xl font-bold text-white">Iconer</h1>

        <div class="relative">
          <label
            for="letter-input"
            class="block text-sm font-medium text-gray-300 mb-1"
            >Letter</label
          >
          <input
            type="text"
            id="letter-input"
            value="A"
            class="w-full bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5"
            autocomplete="off"
          />
          <div
            id="autocomplete-dropdown"
            class="hidden absolute z-10 w-full mt-1 bg-gray-700 border border-gray-600 rounded-lg shadow-lg max-h-64 overflow-y-auto"
          >
            <div id="autocomplete-list" class="py-1"></div>
          </div>
          <p class="text-xs text-gray-400 mt-1">
            Type : for Iconoir or { for Phosphor (semantic search enabled)
          </p>
        </div>

        <div>
          <label
            for="font-input"
            class="block text-sm font-medium text-gray-300 mb-1"
            >Google Font Name (or system font)</label
          >
          <input
            type="text"
            id="font-input"
            value="Sixtyfour"
            placeholder="e.g., Poppins, Roboto, serif"
            class="w-full bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5"
          />
          <p class="text-xs text-gray-400 mt-1">
            Case-sensitive. E.g., 'Playfair Display'.
          </p>
        </div>

        <div>
          <label
            for="css-input"
            class="block text-sm font-medium text-gray-300 mb-1"
            >Custom CSS Styling</label
          >
          <textarea
            id="css-input"
            rows="6"
            class="w-full bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 font-mono text-xs"
            placeholder="/* Example */&#10;#letter-wrapper { background: #111; }&#10;#letter-display { color: #fff; }"
          >
#letter-wrapper {
    background-color: #000000;
}
#letter-display {
    color: #ffffff;
    text-shadow: 2px 2px 2px #ff0000;
}</textarea
          >
          <p class="text-xs text-gray-400 mt-1">
            Apply background styles to `#letter-wrapper`. Apply text styles to
            `#letter-display`.
          </p>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label
              for="size-input"
              class="block text-sm font-medium text-gray-300 mb-1"
              >Image Size (px)</label
            >
            <input
              type="number"
              id="size-input"
              value="256"
              min="32"
              max="2048"
              step="16"
              class="w-full bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5"
            />
          </div>
          <div>
            <label
              for="font-size-input"
              class="block text-sm font-medium text-gray-300 mb-1"
              >Font Size (%)</label
            >
            <input
              type="number"
              id="font-size-input"
              value="75"
              min="10"
              max="200"
              class="w-full bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5"
            />
          </div>
        </div>
      </div>

      <!-- PREVIEW & DOWNLOAD -->
      <div
        class="lg:w-1/2 w-full flex flex-col items-center justify-center space-y-6"
      >
        <div id="preview-container" class="bg-gray-700 rounded-lg p-4">
          <!-- Flexbox removed. Classic centering is now handled in JS. -->
          <div id="letter-wrapper" class="shadow-inner overflow-hidden">
            <span id="letter-display" class="select-none">A</span>
          </div>
        </div>

        <button
          id="download-btn"
          class="w-full max-w-xs bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors duration-200 flex items-center justify-center gap-2"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          <span>Generate & Download PNG</span>
        </button>
        <div
          id="loader-container"
          class="hidden h-10 w-10 items-center justify-center"
        >
          <div class="loader"></div>
        </div>
      </div>
    </div>

    <style id="custom-css-style"></style>

    <script type="module" src="main.js"></script>
  </body>
</html>
