<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Stacking Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            font-family: 'Inter', sans-serif;
        }
        #game-canvas {
            display: block;
        }
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Let clicks pass through to the canvas */
        }
        .ui-element {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            pointer-events: auto; /* Re-enable pointer events for UI elements */
        }
        #score {
            position: absolute;
            top: 30px;
            width: 100%;
            text-align: center;
            font-size: 4rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0px 2px 6px rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }
        #game-over-ui {
            display: none; /* This is toggled by JS to 'flex' */
            flex-direction: column;
            gap: 0.25rem;
            padding: 1.5rem 3rem;
        }
        #game-over-ui h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0;
        }
        #game-over-ui p {
            font-size: 1.1rem;
            margin-bottom: 0.75rem;
        }
        #restart-button {
             background-color: #4f46e5;
             color: white;
             border: none;
             padding: 0.75rem 1.5rem;
             border-radius: 0.5rem;
             font-weight: bold;
             cursor: pointer;
             margin-top: 1rem;
             transition: background-color 0.2s;
        }
        #restart-button:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>
    <!-- Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- UI Elements -->
    <div class="ui-container">
        <div id="score">0</div>
        <div id="instructions" class="ui-element" style="position: absolute; bottom: 20px; padding: 0.5rem 1rem;">Click to start and place the block</div>
        <div id="game-over-ui" class="ui-element">
            <h1>Game Over</h1>
            <p>Your final score is <span id="final-score">0</span></p>
            <button id="restart-button">Restart</button>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

    <script>
        // --- Game Setup ---
        let scene, camera, renderer, world;
        let stack = [];
        let overhangs = [];
        let perfectEffects = []; // Array to hold the visual effects
        let gameStarted = false; // Manages the state of a single game round

        const scoreElement = document.getElementById('score');
        const instructionsElement = document.getElementById('instructions');
        const gameOverUI = document.getElementById('game-over-ui');
        const finalScoreElement = document.getElementById('final-score');
        const restartButton = document.getElementById('restart-button');

        // --- Core Functions ---
        function init() {
            // --- CANNON.js World Setup ---
            world = new CANNON.World();
            world.gravity.set(0, -10, 0); // Gravity pulls things down
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 40;

            // --- THREE.js Scene Setup ---
            scene = new THREE.Scene();

            // --- Lights ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
            directionalLight.position.set(10, 20, 0);
            scene.add(directionalLight);

            // --- Camera ---
            const aspect = window.innerWidth / window.innerHeight;
            const width = 40; // Increased width again as a wider buffer
            const height = width / aspect;

            camera = new THREE.OrthographicCamera(
                width / -2, // left
                width / 2, // right
                height / 2, // top
                height / -2, // bottom
                -30, // near plane (allow objects behind camera origin)
                100 // far
            );

            // --- Renderer ---
            renderer = new THREE.WebGLRenderer({
                antialias: true,
                canvas: document.getElementById('game-canvas')
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setAnimationLoop(animation);
            
            // --- Start a new game (after all components are initialized) ---
            resetGame();

            // --- Event Listeners ---
            renderer.domElement.addEventListener('click', () => {
                if (!gameStarted) {
                    gameStarted = true;
                    instructionsElement.style.display = 'none';
                }
                
                // Don't do anything if the game is over.
                if (gameOverUI.style.display === 'flex') return;

                if(cutBlock()){
                    scoreElement.innerText = stack.length - 1;
                    const topLayer = stack[stack.length - 1];
                    const nextDirection = topLayer.direction === 'x' ? 'z' : 'x';
                    speed = 0.15 + (stack.length * 0.005);
                    addLayer(
                        nextDirection === 'x' ? -15 : topLayer.threejs.position.x, 
                        nextDirection === 'z' ? -15 : topLayer.threejs.position.z, 
                        topLayer.width, 
                        topLayer.depth,
                        nextDirection
                    );
                }
            });
        }
        
        // This function resets the game to its initial state
        function resetGame() {
            gameStarted = false;
            speed = 0.15; // Reset speed

            // Reset camera
            camera.position.set(4, 4, 4);
            camera.lookAt(0, 0, 0);
            
            // UI updates
            instructionsElement.style.display = 'block';
            gameOverUI.style.display = 'none';
            scoreElement.innerText = 0;

            // Clear old blocks from scene and physics world
            stack.forEach(element => {
                scene.remove(element.threejs);
                if (element.cannonjs) world.remove(element.cannonjs);
            });
            overhangs.forEach(element => {
                scene.remove(element.threejs);
                if (element.cannonjs) world.remove(element.cannonjs);
            });

            stack = [];
            overhangs = [];
            
            // Add foundation and first moving block
            addLayer(0, 0, 10, 10, 'foundation');
            addLayer(-15, 0, 10, 10, 'x');
        }

        // --- Game Logic Functions ---
        function triggerPerfectEffect(x, y, z, color) {
            const geometry = new THREE.RingGeometry(0.5, 1, 32);
            // Use the block's color for the effect
            const material = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            // Rotate the ring to lie flat on top of the block
            mesh.rotation.x = -Math.PI / 2;
            scene.add(mesh);
            perfectEffects.push({ mesh, life: 1.0 });
        }
        
        function addLayer(x, z, width, depth, direction) {
            const y = stack.length * 2; // Each block is 2 units high
            const layer = generateBox(x, y, z, width, depth, false);
            layer.direction = direction;
            stack.push(layer);
        }

        function addOverhang(x, z, width, depth) {
            const y = (stack.length - 1) * 2;
            const overhang = generateBox(x, y, z, width, depth, true);
            overhangs.push(overhang);
        }

        function generateBox(x, y, z, width, depth, falls) {
            // Three.js
            const geometry = new THREE.BoxGeometry(width, 2, depth);
            const color = new THREE.Color(`hsl(${30 + stack.length * 4}, 90%, 60%)`);
            const material = new THREE.MeshLambertMaterial({ color });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            scene.add(mesh);

            // Cannon.js
            const shape = new CANNON.Box(new CANNON.Vec3(width / 2, 1, depth / 2));
            let mass = falls ? 5 : 0; // If it's a falling piece, give it mass
            const body = new CANNON.Body({ mass, shape });
            body.position.set(x, y, z);
            world.addBody(body);

            return {
                threejs: mesh,
                cannonjs: body,
                width,
                depth
            };
        }

        function cutBlock() {
            const topLayer = stack[stack.length - 1];
            const prevLayer = stack[stack.length - 2];
            const direction = topLayer.direction;

            const delta = topLayer.threejs.position[direction] - prevLayer.threejs.position[direction];
            const overhangSize = Math.abs(delta);
            const size = direction === 'x' ? topLayer.width : topLayer.depth;
            const overlap = size - overhangSize;

            if (overlap > 0) {
                // Determine the dimensions of the cut pieces
                const newWidth = direction === 'x' ? overlap : topLayer.width;
                const newDepth = direction === 'z' ? overlap : topLayer.depth;

                // Update the current block to be the part that stays
                topLayer.width = newWidth;
                topLayer.depth = newDepth;
                topLayer.threejs.scale[direction] = overlap / size;
                topLayer.threejs.position[direction] -= delta / 2;
                
                // Update Cannon.js body as well
                topLayer.cannonjs.position[direction] -= delta/2;
                const newShape = new CANNON.Box(new CANNON.Vec3(newWidth/2, 1, newDepth/2));
                topLayer.cannonjs.shapes = []; // remove old shape
                topLayer.cannonjs.addShape(newShape);


                // Check for perfect placement BEFORE creating the overhang
                const PERFECT_THRESHOLD = 0.1;
                if (overhangSize < PERFECT_THRESHOLD) {
                    const topY = topLayer.threejs.position.y + 1.01; // Place slightly above the block to prevent clipping
                    triggerPerfectEffect(topLayer.threejs.position.x, topY, topLayer.threejs.position.z, topLayer.threejs.material.color);
                }


                // Create the overhang block that falls
                const overhangWidth = direction === 'x' ? overhangSize : newWidth;
                const overhangDepth = direction === 'z' ? overhangSize : newDepth;
                
                const overhangShiftX = (direction === 'x')
                    ? topLayer.threejs.position.x + (overlap / 2 * Math.sign(delta)) + (overhangSize / 2 * Math.sign(delta))
                    : topLayer.threejs.position.x;
                
                const overhangShiftZ = (direction === 'z')
                    ? topLayer.threejs.position.z + (overlap / 2 * Math.sign(delta)) + (overhangSize / 2 * Math.sign(delta))
                    : topLayer.threejs.position.z;


                addOverhang(overhangShiftX, overhangShiftZ, overhangWidth, overhangDepth);

                return true; // Success
            } else {
                 // Missed completely - make the block fall
                topLayer.cannonjs.mass = 5;
                topLayer.cannonjs.updateMassProperties();
                overhangs.push(topLayer);
                stack.pop(); // The block is no longer part of the stable stack
                
                endGame();
                return false;
            }
        }
        
        function endGame() {
            gameStarted = false; // Stop new blocks from being placed
            gameOverUI.style.display = 'flex';
            // The score is the number of successfully placed blocks
            finalScoreElement.innerText = stack.length - 1;
        }


        // --- Other Event Listeners ---
        window.addEventListener('resize', () => {
            // Adjust camera on resize
            const aspect = window.innerWidth / window.innerHeight;
            const width = 60; // Match the initial camera width to prevent clipping
            const height = width / aspect;
            camera.left = width / -2;
            camera.right = width / 2;
            camera.top = height / 2;
            camera.bottom = height / -2;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        restartButton.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent the click from registering on the canvas
            resetGame();
        });


        // --- Animation Loop ---
        let speed = 0.15;
        function animation() {
            // The moving block is always the last one in the stack
            if (stack.length === 0) return; // Prevent errors on reset
            const topLayer = stack[stack.length - 1];

            // Only move the block if it's not the static foundation
            if (topLayer.direction !== 'foundation') {
                topLayer.threejs.position[topLayer.direction] += speed;
                topLayer.cannonjs.position[topLayer.direction] += speed;

                // Reverse direction if it goes too far
                if (topLayer.threejs.position[topLayer.direction] > 15) {
                    speed = -Math.abs(speed);
                }
                if (topLayer.threejs.position[topLayer.direction] < -15) {
                    speed = Math.abs(speed);
                }
            }

            // Move camera up with the stack, but only after the game starts
            if (gameStarted) {
                const cameraTargetY = stack.length * 2 + 2;
                camera.position.y += (cameraTargetY - camera.position.y) * 0.05;
            }

            // Animate and clean up perfect placement effects
            for (let i = perfectEffects.length - 1; i >= 0; i--) {
                const effect = perfectEffects[i];
                effect.life -= 0.03; // Controls fade and expansion speed

                if (effect.life <= 0) {
                    scene.remove(effect.mesh);
                    perfectEffects.splice(i, 1);
                } else {
                    const scale = (1 - effect.life) * 15;
                    effect.mesh.scale.set(scale, scale, scale);
                    effect.mesh.material.opacity = effect.life;
                }
            }

            // Update physics world and sync meshes for falling pieces
            world.step(1 / 60);
            overhangs.forEach(element => {
                element.threejs.position.copy(element.cannonjs.position);
                element.threejs.quaternion.copy(element.cannonjs.quaternion);
            });

            renderer.render(scene, camera);
        }

        // --- Start ---
        init();
    </script>
</body>
</html>
