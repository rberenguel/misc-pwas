<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GDash</title>

    <!-- PWA Manifest and Theme Color -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1a1a1a" />

    <!-- Fonts and Icons -->
    <link rel="stylesheet" href="fonts/iconoir/iconoir.css" />
    <link rel="stylesheet" href="fonts/monoid.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-container">
      <div id="cards-container"></div>
    </div>

    <button id="add-card-btn" title="Drop a URL to create a card">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>

    <div id="delete-modal" class="modal-overlay">
      <div class="modal">
        <h2>Confirm Deletion</h2>
        <p>
          Are you sure you want to delete this card? This action cannot be
          undone.
        </p>
        <div class="modal-actions">
          <button class="modal-btn cancel-btn">Cancel</button>
          <button id="confirm-delete-btn" class="modal-btn danger">
            Delete
          </button>
        </div>
      </div>
    </div>

    <div id="path-modal" class="modal-overlay">
      <div class="modal">
        <h2>Project Folder Path</h2>
        <p>Enter the absolute path to the project folder.</p>
        <input
          type="text"
          id="path-input"
          class="modal-input"
          placeholder="/Users/yourname/projects/my-project"
        />
        <div class="modal-actions">
          <button class="modal-btn cancel-btn">Cancel</button>
          <button id="confirm-path-btn" class="modal-btn confirm">Save</button>
        </div>
      </div>
    </div>

    <script type="module" src="gdash.js"></script>
  </body>
</html>
