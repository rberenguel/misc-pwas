<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drawhat</title>
<meta name="theme-color" content="#1b1a17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="fonts/phosphor/phosphor.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="p"><i class="ph-light ph-caret-left"></i></button>
  <span id="d"></span>
  <button id="n"><i class="ph-light ph-caret-right"></i></button>
</header>
<main>
<div class="l"><div class="k">object</div><div class="w" id="w0"></div></div>
<div class="l"><div class="k">scene / subject</div><div class="w" id="w1"></div></div>
<div class="l"><div class="k">quality</div><div class="w" id="w2"></div></div>
</main>
<footer id="f"></footer>
<div id="update-banner">
  <span>Update available — <a href="#" id="update-link">reload</a></span>
  <span id="update-close">&#x2715;</span>
</div>
<script src="words.js"></script>
<script src="script.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(registration => {
        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'activated' && navigator.serviceWorker.controller) {
              const banner = document.getElementById('update-banner');
              if (banner) banner.style.display = 'flex';
            }
          });
        });
      })
      .catch(err => console.error('SW registration failed:', err));
  });

  const updateLink = document.getElementById('update-link');
  if (updateLink) {
    updateLink.addEventListener('click', e => {
      e.preventDefault();
      window.location.reload();
    });
  }

  const updateClose = document.getElementById('update-close');
  if (updateClose) {
    updateClose.addEventListener('click', () => {
      const banner = document.getElementById('update-banner');
      if (banner) banner.style.display = 'none';
    });
  }
}
</script>
</body>
</html>
