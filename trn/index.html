<!DOCTYPE html>
<html>
<head>
    <title>Grid Clash Prototype</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #05050a;
            font-family: 'Inter', sans-serif;
            color: #fff;
        }
        canvas {
            display: block;
        }
        #grind-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
            box-shadow: none; /* Default to no shadow */
        }
        #grind-vignette.active {
            opacity: 1;
        }
        #grind-vignette.grind {
            box-shadow: inset 0 0 120px 40px rgba(255, 255, 0, 0.7);
        }
        #grind-vignette.speed {
            box-shadow: inset 0 0 120px 40px rgba(0, 255, 0, 0.6);
        }
        #grind-vignette.turbo {
            box-shadow: inset 0 0 120px 40px rgba(255, 0, 255, 0.7);
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.1.5/pixi.min.js"></script>
</head>
<body>
  <div id="grind-vignette"></div>
    <script src="main.js"></script>
</body>
</html>
