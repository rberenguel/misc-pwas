<!DOCTYPE html>
<html>
<head>
    <title>Flux</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #05050a;
    font-family: 'Sixtyfour', sans-serif;
    color: #fff;
    -webkit-user-select: none; /* Safari */
    user-select: none;
    -webkit-touch-callout: none; /* Disable iOS callout menu */
    touch-action: manipulation;
}
        canvas {
            display: block;
        }
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #05050a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10002;
            cursor: pointer;
            text-align: center;
        }
        .splash-content h1 {
            font-size: clamp(48px, 12vw, 96px);
            color: #00FFFF;
            margin-bottom: 40px;
            text-shadow: 0 0 5px #FFFF0055, 0 0 8px #FFFF00;
        }
        .splash-content .controls {
            font-family: monospace;
            font-size: clamp(14px, 2.5vw, 16px);
            color: #CCCCCC;
            display: inline-block;
            border: 1px solid #40406a;
            padding: 20px 30px;
            background: rgba(10, 10, 20, 0.3);
        }
        .splash-content .controls p {
            margin: 12px 0;
            display: grid;
            grid-template-columns: 70px auto;
            gap: 20px;
            text-align: left;
        }
        .splash-content .controls p span:first-child {
            color: #FFFFFF;
            font-weight: bold;
            text-align: right;
        }
        .splash-content .start-prompt {
            margin-top: 50px;
            font-size: clamp(18px, 3vw, 24px);
            color: #FFFFFF;
            animation: blink 1.5s infinite ease-in-out;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        #grind-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
            box-shadow: none;
        }
        #grind-vignette.active {
            opacity: 1;
        }
        #grind-vignette.grind {
            box-shadow: inset 0 0 120px 40px rgba(255, 255, 0, 0.7);
        }
        #grind-vignette.speed {
            box-shadow: inset 0 0 120px 40px rgba(0, 255, 0, 0.6);
        }
        #grind-vignette.turbo {
            box-shadow: inset 0 0 120px 40px rgba(255, 0, 255, 0.7);
        }
        .pause-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 10001;
        }
        .pause-menu {
            text-align: center;
        }
        .pause-menu h1 {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .pause-menu p {
            font-size: 24px;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sixtyfour&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.1.5/pixi.min.js"></script>
</head>
<body>
  <div id="splash-screen">
      <div class="splash-content">
          <h1>FLUX</h1>
          <div class="controls">
              <p><span>TURN</span><span>ARROWS / TAP SIDES</span></p>
              <p><span>ACTION</span><span>SPACE / TAP BOTH</span></p>
              <p><span>PAUSE</span><span>ESCAPE / TAP TOP</span></p>
          </div>
          <p class="start-prompt">TAP ANYWHERE TO START</p>
      </div>
  </div>
  <div id="grind-vignette"></div>
  <div id="pause-overlay" class="pause-overlay">
      <div class="pause-menu">
          <h1>PAUSED</h1>
          <p>Tap anywhere or press Escape to resume</p>
      </div>
  </div>
    <script src="main.js"></script>
</body>
</html>
