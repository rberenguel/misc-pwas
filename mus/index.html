<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>mus</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="shortcut icon" href="icon.png" type="image/png">
<link rel="stylesheet" href="fonts/phosphor/phosphor.css">
<link rel="stylesheet" href="src/css/style.css">
</head>
<body>

<div id="toolbar">
    <button id="btnPlay" aria-label="Play"><i class="ph-light ph-play"></i></button>
    <button id="btnStop" aria-label="Stop"><i class="ph-light ph-stop"></i></button>
    <button id="btnClear" aria-label="Clear Grid"><i class="ph-light ph-trash"></i></button>
    <button id="btnExport" aria-label="Export"><i class="ph-light ph-export"></i></button>
    <select id="slotSelect"></select>
</div>

<div id="scroll-wrapper">
    <div id="piano-keys"></div>
    <div id="grid"></div>
</div>

<div id="clearModal">
    <div id="clearDialog">
        <p>Clear all notes?</p>
        <div id="clearActions">
            <button id="btnClearConfirm">Clear</button>
            <button id="btnClearCancel">Cancel</button>
        </div>
    </div>
</div>

<div id="exportModal">
    <div id="exportHeader">
        <button id="btnCloseExport" aria-label="Close"><i class="ph-light ph-x"></i></button>
    </div>
    <div id="exportScroll">
        <table id="exportTable"></table>
    </div>
</div>

<div id="update-banner" hidden>
    Update available — <a href="#" id="update-link">reload</a>
</div>

<script src="src/js/app.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(registration => {
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        if (!newWorker) return;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'activated' && navigator.serviceWorker.controller) {
                                document.getElementById('update-banner').hidden = false;
                            }
                        });
                    });
                })
                .catch(err => console.error('SW registration failed:', err));
        });

        document.getElementById('update-link').addEventListener('click', e => {
            e.preventDefault();
            window.location.reload();
        });
    }
</script>
</body>
</html>
